name: macOS packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            output: mac-arm64
            graphics: native
          - runner: macos-15-intel
            arch: x64
            output: mac
            graphics: software
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package DMG and ZIP
        run: npm run package:mac -- --${{ matrix.arch }}
      - name: Install desktop test driver
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Test packaged application on macOS
        run: npm run test:desktop
        env:
          KATMAN_EXECUTABLE: ${{ github.workspace }}/dist/${{ matrix.output }}/Katman Studio.app/Contents/MacOS/Katman Studio
      - name: Test local 3D editing on macOS
        run: node tests/mesh-editor-ui.mjs
        env:
          KATMAN_NATIVE: '1'
          KATMAN_GL: ${{ matrix.graphics }}
          PLAYWRIGHT_PATH: playwright
          KATMAN_EXECUTABLE: ${{ github.workspace }}/dist/${{ matrix.output }}/Katman Studio.app/Contents/MacOS/Katman Studio
      - uses: actions/upload-artifact@v4
        with:
          name: Katman-Studio-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test-${{ matrix.arch }}
          path: test-results/
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: Katman-Studio-mac-*
          merge-multiple: true
          path: mac-packages
      - name: Publish Mac downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" mac-packages/* --title "Katman Studio $RELEASE_TAG — macOS" --notes-file docs/macos-release.md
